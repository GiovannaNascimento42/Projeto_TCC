amcl:
  ros__parameters:
    use_sim_time: false

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"
    map_topic: "/map"

    tf_broadcast: true
    transform_tolerance: 0.5

    min_particles: 500
    max_particles: 2000

    laser_model_type: "likelihood_field"
    laser_max_range: 16.0
    laser_min_range: 0.15
    max_beams: 60

    update_min_d: 0.10
    update_min_a: 0.10

    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    set_initial_pose: false


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/giovanna/nav2_ws/src/meu_robo_nav/config/meu_mapa_odom_teste.yaml"
    topic_name: "map"
    frame_id: "map"


planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      min_vel_x: 0.0
      max_vel_x: 0.30

      min_vel_y: 0.0
      max_vel_y: 0.0

      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0

      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0

      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.5

      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist


behavior_server:
  ros__parameters:
    use_sim_time: false

    global_frame: "map"
    robot_base_frame: "base_link"

    cycle_frequency: 10.0

    enable_stamped_cmd_vel: false


bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odom"

    enable_stamped_cmd_vel: false

    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: "odom"
      robot_base_frame: "base_link"

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      footprint: "[[0.175, 0.175], [0.175, -0.175], [-0.175, -0.175], [-0.175, 0.175]]"

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 16.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.25


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: "map"
      robot_base_frame: "base_link"

      resolution: 0.05

      track_unknown_space: true

      footprint: "[[0.175, 0.175], [0.175, -0.175], [-0.175, -0.175], [-0.175, 0.175]]"

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 16.0
          obstacle_max_range: 16.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.25


waypoint_follower:
  ros__parameters:
    use_sim_time: false

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"


velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity: [0.30, 0.0, 0.8]
    min_velocity: [-0.30, 0.0, -0.8]

    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]

    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    state_topic: "collision_monitor_state"

    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons: ["PolygonStop"]

    PolygonStop:
      type: "polygon"
      points: "[[0.20, 0.20], [0.20, -0.20], [-0.20, -0.20], [-0.20, 0.20]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
